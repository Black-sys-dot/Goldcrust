<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tickets — GOLDCRUST</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍗</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css?v=7">
</head>
<body>
  <div id="chrome"></div>

  <section class="section section--tight">
    <div class="wrap">
      <p class="eyebrow">Your copies</p>
      <h1 style="font-size:clamp(1.9rem,4vw,2.7rem);margin:12px 0 8px">Tickets</h1>
      <p class="hint">Each paid order keeps a ticket here. The stage follows the kitchen.</p>
      <form class="search" id="lookup" style="max-width:460px;margin-top:16px">
        <input id="ticketCode" placeholder="Ticket number, e.g. GC100003" aria-label="Ticket number" autocomplete="off">
        <button class="btn btn--primary btn--sm" type="submit">Find</button>
      </form>
      <p id="lookupNote" class="hint" style="display:none"></p>
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="wrap ticket-list" id="ticketList"></div>
  </section>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js?v=5"></script>
  <script>
    mountChrome('tickets');

    const list = $('#ticketList');
    const params = new URLSearchParams(location.search);
    const highlighted = (params.get('ticket') || '').replace(/\s|#/g, '').toUpperCase();
    if (highlighted) Tickets.remember(highlighted);

    async function loadTicket(id) {
      const res = await fetch('/api/tickets/' + encodeURIComponent(id));
      if (!res.ok) return null;
      const data = await res.json();
      return data.ticket;
    }

    async function paint() {
      const ids = Tickets.ids();
      if (!ids.length) {
        list.innerHTML = `
          <div class="empty" style="padding:64px 16px">
            <i>🎟️</i>
            <h4>No tickets yet</h4>
            <p>Pay for an order and the ticket lands here, with its stage.</p>
            <a class="btn btn--primary" style="margin-top:16px" href="menu.html">Browse the menu</a>
          </div>`;
        return;
      }
      const tickets = (await Promise.all(ids.map(loadTicket))).filter(Boolean);
      if (!tickets.length) {
        list.innerHTML = `
          <div class="empty" style="padding:64px 16px">
            <i>🎟️</i>
            <h4>Those tickets are not active</h4>
            <p>A ticket appears after the kitchen has the order.</p>
          </div>`;
        return;
      }
      list.innerHTML = tickets.map(ticket => `
        <div class="${ticket.ticket === highlighted ? 'is-focus' : ''}">
          ${ticketCard(ticket)}
        </div>`).join('');
    }

    $('#lookup').addEventListener('submit', async e => {
      e.preventDefault();
      const code = $('#ticketCode').value.trim();
      const note = $('#lookupNote');
      if (!code) return;
      const ticket = await loadTicket(code);
      note.style.display = 'block';
      if (!ticket) {
        note.style.color = 'var(--red)';
        note.textContent = 'No ticket with that number yet. It is issued after payment.';
        return;
      }
      Tickets.remember(ticket.ticket);
      note.style.color = 'var(--green)';
      note.textContent = 'Added to your tickets.';
      $('#ticketCode').value = '';
      history.replaceState(null, '', 'tickets.html?ticket=' + encodeURIComponent(ticket.ticket));
      paint();
    });

    paint();
    setInterval(paint, 4000);
  </script>
</body>
</html>
